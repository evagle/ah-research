functions:
- id: research-reports
  authority: High
  utility: High
  workflow_evidence: High
  field_contract_evidence: Medium
  direct_urls:
  - url: https://www.frostchina.com/zh/content/search?page=1&query%5BfuzzyQuery%5D=
    kind: China keyword search base
    stability: stable public query route; append a URL-encoded keyword
  - url: https://www.frostchina.com/zh/content/insight?page=1&query%5Btag%5D=INDUSTRY-RESEARCH
    kind: China industry research archive
    stability: stable public filtered route
  - url: https://store.frost.com/industries.html
    kind: global industry directory
    stability: public category route
  search:
    method: official China fuzzy search and industry archive, then global store category and publisher-bound search
    fields:
    - official_domain
    - industry
    - metric
    - company
    - geography
    - year
    example_query: 'https://www.frostchina.com/zh/content/search?page=1&query%5BfuzzyQuery%5D={URL-encoded industry or metric}'
    result_identity: Frost & Sullivan title, publication date, content id or report id, industry, period, geography, metric scope, commissioning context, official URL
  citation:
    use: attributable Frost & Sullivan measurement with period, denominator, geography, methodology, and commissioning context noted
    required_fields:
    - publisher
    - title
    - date
    - url
  fallbacks:
  - iresearch-research-reports
