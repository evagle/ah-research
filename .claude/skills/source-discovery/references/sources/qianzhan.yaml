    kind: original research article archive
    stability: reviewed seed
  search:
    method: publisher-bound web search
    fields:
    - official_domain
    - exact_title
    - industry
    - year
    example_query: 'site:bg.qianzhan.com/trends "前瞻产业研究院" "市场份额" "行业年份"'
    result_identity: original publisher, title, author, publication date, cited report, measurement scope, URL
