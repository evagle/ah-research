    kind: report library
    stability: stable public route
  - url: https://s.iresearch.cn/search/
    kind: keyword search base
    stability: append a URL-encoded keyword and trailing slash
  - url: https://report.iresearch.cn/report_pdf.aspx
    kind: report preview base
    stability: append the report page id as the id query parameter
  search:
    method: official keyword search, report-only search, then report page and preview
    fields:
    - official_domain
    - industry
    - metric
    - year
    - report_id
    example_query: 'https://s.iresearch.cn/report/{URL-encoded industry keyword}/'
    result_identity: iResearch report title, publication date, report id, official report URL, preview URL, metric definition, period, geography, units
  citation:
    use: attributable measurement with methodology and coverage noted
    required_fields:
    - publisher
    - title
    - date
    - url
  fallbacks:
